name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: App-Bundle bauen
        run: ./scripts/make-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Gridline-app
          path: build/Gridline.zip
          retention-days: 14

  ios:
    name: Build iOS/iPadOS (Simulator)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: XcodeGen installieren
        run: brew install xcodegen
      - name: Xcode-Projekt erzeugen
        run: ./scripts/make-ios-project.sh
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project iOS/GridlineiOS.xcodeproj \
            -scheme GridlineiOS \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO | tail -n 80
