# XcodeGen-Spezifikation für die iPhone- und iPad-App.
# Erzeugen: `cd iOS && xcodegen` (oder ./scripts/make-ios-project.sh), dann GridlineiOS.xcodeproj öffnen.
name: GridlineiOS
options:
  bundleIdPrefix: io.github.malagant
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Gridline:
    path: ..
targets:
  GridlineiOS:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: Gridline
        product: GridlineUI
    scheme: {}
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Gridline
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.malagant.gridline
        PRODUCT_NAME: Gridline
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        # Für ein echtes Gerät in Xcode unter Signing & Capabilities das eigene Team wählen.
        DEVELOPMENT_TEAM: ""
